name: App bauen

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build-Protokoll bei Fehler bereitstellen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-protokoll --yes --cleanup-tag || true
          gh release create build-protokoll build.log --title "Build-Protokoll (Fehler)" --notes "Protokoll des fehlgeschlagenen Builds ${{ github.run_number }}" --prerelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Sonnenwecker.apk

      - name: Als Download bereitstellen (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-protokoll --yes --cleanup-tag || true
          gh release delete neueste-version --yes --cleanup-tag || true
          gh release create neueste-version Sonnenwecker.apk \
            --title "Sonnenwecker – Build ${{ github.run_number }}" \
            --notes "Auf dem Handy herunterladen und installieren. Updates installieren sich über die alte Version."
